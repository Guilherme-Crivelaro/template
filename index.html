<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Área de Compra</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div id="end">
      <h3>Área de Compra</h3>
    </div>
  </header>

  <div class="container">
    <div class="product">
      <p><strong>Nome:</strong> Produto Genérico</p>
      <p><strong>Preço:</strong> R$ 20,00</p>
      <label for="quantidade">Quantidade:</label>
      <input type="number" id="quantidade" min="1" value="1">
    </div>
    <button class="btn" onclick="comprar()">Comprar</button>
    <div class="result" id="resultado"></div>
  </div>

  <script src="script.js"> </script>

</body>
</html>
